name: praca-angola
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: praca_angola
      POSTGRES_USER: praca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-praca_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praca -d praca_angola"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.30
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-local-search-key-change-before-production}
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O - http://127.0.0.1:7700/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  object-storage:
    image: chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-praca_local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-local_storage_password_change_before_production}
      S3_BUCKET: ${S3_BUCKET:-praca-media}
    ports:
      - "8333:8333"
    volumes:
      - seaweed_data:/data

volumes:
  postgres_data:
  redis_data:
  meili_data:
  seaweed_data:
