error_page 429 = @auth_rate_limited;

# Session reads accompany navigation and share IPs on mobile/corporate networks.
# They do not consume the credential-attempt budget.
location ~* ^/api/v1/auth/me/?$ {
    limit_req zone=auth_session burst=200 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/proxy-common.conf;
}

location ~* ^/api/v1/auth/logout/?$ {
    limit_req zone=auth_logout burst=30 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/proxy-common.conf;
}

location ~* ^/api/v1/auth/login/?$ {
    limit_req zone=auth_all burst=30 nodelay;
    limit_req zone=auth_login burst=20 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/proxy-common.conf;
}

location ~* ^/api/v1/auth/register/?$ {
    limit_req zone=auth_all burst=30 nodelay;
    limit_req zone=auth_register burst=10 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/proxy-common.conf;
}

location ~* ^/api/v1/auth/(email-verification-requests|password-reset-requests)/?$ {
    limit_req zone=auth_all burst=30 nodelay;
    limit_req zone=auth_email_requests burst=10 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/proxy-common.conf;
}

location ~* ^/api/v1/auth/(email-verifications|password-resets)/?$ {
    limit_req zone=auth_all burst=30 nodelay;
    limit_req zone=auth_token_actions burst=10 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/proxy-common.conf;
}

# Catch unknown auth paths and URI variants so they cannot bypass the general budget.
location ~* ^/api/v1/auth(?:/|$) {
    limit_req zone=auth_all burst=30 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/proxy-common.conf;
}

location @auth_rate_limited {
    internal;
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
    return 429 '{"code":"AUTH_RATE_LIMITED","message":"Muitos pedidos. Aguarda um minuto e tenta novamente."}';
}
