name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @puvo/api test
      - run: pnpm build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: praca_angola
          POSTGRES_USER: praca
          POSTGRES_PASSWORD: praca
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U praca -d praca_angola"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @puvo/api db:migrate
        env:
          DATABASE_URL: postgresql://praca:praca@localhost:5432/praca_angola
      - run: pnpm --filter @puvo/api db:migrate
        env:
          DATABASE_URL: postgresql://praca:praca@localhost:5432/praca_angola
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql postgresql://praca:praca@localhost:5432/praca_angola -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose -p praca-angola-dev -f docker-compose.yml -f compose.dev.yml up -d --build
      - run: |
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3100/_ingress-health >/dev/null && curl -fsS http://localhost:3100/api/v1/health/ready >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = "1"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        run: docker compose -p praca-angola-dev -f docker-compose.yml -f compose.dev.yml logs --no-color
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: output/playwright
      - if: always()
        run: docker compose -p praca-angola-dev -f docker-compose.yml -f compose.dev.yml down -v
