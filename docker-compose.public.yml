services:
  ingress:
    volumes:
      - ./infra/nginx/trusted-proxies.public.conf:/etc/nginx/trusted-proxies.conf:ro
      - ./infra/nginx/proxy-common.public.conf:/etc/nginx/proxy-common.conf:ro
    networks:
      default: {}
      public_edge:
        ipv4_address: 172.30.255.3

  caddy:
    image: caddy:2.11.7-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Defina PUBLIC_DOMAIN no .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL no .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      public_edge:
        ipv4_address: 172.30.255.2
    depends_on:
      ingress:
        condition: service_healthy

networks:
  public_edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.255.0/29

volumes:
  caddy_data:
  caddy_config:
